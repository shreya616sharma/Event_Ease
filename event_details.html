        // Function to get query parameter (compatible with file:// protocol)
        function getQueryParam(name) {
            const url = window.location.href;
            name = name.replace(/[\[\]]/g, '\\$&');
            const regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
                results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, ' '));
        }

        // Get event ID from URL
        const eventId = getQueryParam('id');

        if (eventId && eventsData[eventId]) {
            const event = eventsData[eventId];
            document.getElementById('event-name').textContent = event.name;
            document.getElementById('event-description').textContent = event.description;
            document.getElementById('event-date').textContent = event.date;
            document.getElementById('event-time').textContent = event.time;
            document.getElementById('event-venue').textContent = event.venue;
            document.getElementById('event-photo').src = event.photo;
            document.getElementById('event-photo').alt = event.name;
        } else {
            document.getElementById('event-name').textContent = 'Event Not Found';
            document.getElementById('event-description').textContent = 'The requested event could not be found.';
        }

    <script>
        // Header toggle: show Login/Signup when not logged in, Logout when logged in
        (function () {
            function isLoggedIn() { return !!localStorage.getItem('userToken'); }
            document.addEventListener('DOMContentLoaded', () => {
                const headerAction = document.getElementById('header-action');
                if (!headerAction) return;
                if (isLoggedIn()) {
                    headerAction.textContent = 'Logout';
                    headerAction.href = '#';
                    headerAction.classList.add('logout-button');
                    headerAction.addEventListener('click', (e) => {
                        e.preventDefault();
                        localStorage.removeItem('userToken');
                        window.location.href = 'index.html';
                    });

                    // When logged in, swap main nav to student links and mark Events active
                    const navLinks = document.querySelector('.nav-links');
                    if (navLinks) {
                        navLinks.innerHTML = '\n                            <a href="student_dashboard.html">My Dashboard</a>\n                            <a href="my_events.html" class="active">Events</a>\n                            <a href="clubs.html">Clubs</a>\n                        ';
                    }
                } else {
                    const returnUrl = encodeURIComponent(window.location.pathname + window.location.search);
                    headerAction.textContent = 'Login/Signup';
                    headerAction.href = 'login.html?return=' + returnUrl;
                }
            });
        })();
    </script>

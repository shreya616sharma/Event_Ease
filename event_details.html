<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details - EventEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index2.css">
    <link rel="stylesheet" href="Head_of_club_dashboard.css">
</head>
<body>
    <header class="site-header sticky-header">
        <div class="container">
            <nav class="header-nav">
                <a href="index.html" class="logo-link">EventEase</a>
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="event.html">Events</a>
                    <a href="clubs.html">Clubs</a>
                    <a href="about.html">About us</a>
                </div>
                <div class="header-actions">
                    <a href="login.html" class="login-button">Login/Signup</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero-section">
            <div class="container">
                <div class="hero-content-wrapper">
                    <div class="hero-text">
                        <h1 class="hero-headline" id="event-name">Event Name</h1>
                        <p class="hero-description" id="event-description">Event description will be loaded here.</p>
                        <div class="event-details">
                            <p><strong>Date:</strong> <span id="event-date">Date</span></p>
                            <p><strong>Time:</strong> <span id="event-time">Time</span></p>
                            <p><strong>Venue:</strong> <span id="event-venue">Venue</span></p>
                        </div>
                        <a href="login.html" class="hero-cta-button">RSVP/Register</a>
                    </div>
                    <div class="hero-image-container">
                        <div class="hero-image-bg-shape"></div>
                        <img id="event-photo" src="" alt="Event Photo" class="hero-image">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Event data for public event details page
        const eventsData = {
            1: {
                name: "Tech Talk: The Future of AI",
                description: "Join us for an insightful discussion on the latest advancements in Artificial Intelligence, featuring industry experts and interactive Q&A sessions.",
                date: "2025-05-15",
                time: "3:00 PM - 5:00 PM",
                venue: "Auditorium A",
                photo: "tech.jpg"
            },
            2: {
                name: "Spring Dance Festival",
                description: "Experience the vibrant energy of our annual Spring Dance Festival with performances from various dance clubs and talented students.",
                date: "2025-05-20",
                time: "6:00 PM - 10:00 PM",
                venue: "Main Hall",
                photo: "Spring Dance Festival.jpg"
            },
            3: {
                name: "Music Jam Session",
                description: "A relaxed evening of music and collaboration where musicians from all skill levels can join in and share their talents.",
                date: "2025-05-25",
                time: "4:00 PM - 7:00 PM",
                venue: "Music Room 101",
                photo: "Music Jam Session.jpg"
            },
            4: {
                name: "Art Exhibition",
                description: "Showcase of student artwork featuring paintings, sculptures, digital art, and photography from our talented art community.",
                date: "2025-06-01",
                time: "10:00 AM - 4:00 PM",
                venue: "Gallery 3",
                photo: "Art Exhibition.jpg"
            },
            5: {
                name: "Science Fair",
                description: "Explore innovative science projects and experiments from our brightest minds in various scientific disciplines.",
                date: "2025-06-10",
                time: "9:00 AM - 3:00 PM",
                venue: "Science Hall",
                photo: "Science Fair.jpg"
            },
            6: {
                name: "Charity Run",
                description: "Join our community charity run to support local causes while staying active and connecting with fellow students.",
                date: "2025-06-15",
                time: "7:00 AM - 12:00 PM",
                venue: "Campus Grounds",
                photo: "Charity Run.jpg"
            }
        };

        // Get event ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('id');

        if (eventId && eventsData[eventId]) {
            const event = eventsData[eventId];
            document.getElementById('event-name').textContent = event.name;
            document.getElementById('event-description').textContent = event.description;
            document.getElementById('event-date').textContent = event.date;
            document.getElementById('event-time').textContent = event.time;
            document.getElementById('event-venue').textContent = event.venue;
            document.getElementById('event-photo').src = event.photo;
            document.getElementById('event-photo').alt = event.name;
        } else {
            document.getElementById('event-name').textContent = 'Event Not Found';
            document.getElementById('event-description').textContent = 'The requested event could not be found.';
        }
    </script>
</body>
</html>

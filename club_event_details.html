                results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, ' '));

        // Get event ID from URL
        const eventId = getQueryParam('id');

        if (eventId && eventsData[eventId]) {
            const event = eventsData[eventId];
            document.getElementById('event-name').textContent = event.name;
            document.getElementById('event-description').textContent = event.description;
            document.getElementById('event-date').textContent = event.date;
            document.getElementById('event-time').textContent = event.time;
            document.getElementById('event-venue').textContent = event.venue;
            document.getElementById('event-department').textContent = event.department || 'N/A';
            document.getElementById('event-registrations').textContent = event.registrations || 0;
            document.getElementById('event-status').textContent = `Status: ${event.status}`;
            document.getElementById('event-photo').src = event.photo;
            document.getElementById('event-photo').alt = event.name;

            // Conditional rendering based on status
            renderConditionalLayout(event);
        } else {
            document.getElementById('event-name').textContent = 'Event Not Found';
            document.getElementById('event-description').textContent = 'The requested event could not be found.';
        }

        function renderConditionalLayout(event) {
            const status = event.status;
            const registrationCard = document.getElementById('registration-actions-card');
            const registrationsSection = document.getElementById('registrations-section');
            const rightCardTitle = document.getElementById('right-card-title');
            const eventActionsSection = document.getElementById('event-actions-section');
            const registrationsHeading = document.getElementById('registrations-heading');

            if (status === 'Pending Approval') {
                // Hide registration management card
                registrationCard.style.display = 'none';
                // Hide registrations section
                registrationsSection.style.display = 'none';
                // Update left card actions for pending request
                eventActionsSection.innerHTML = `
                    <button class="action-button primary" onclick="editRequest()">Edit Request</button>
                    <button class="action-button secondary" onclick="duplicateEvent()">Duplicate Event</button>
                    <button class="action-button danger" onclick="withdrawRequest()">Withdraw Request</button>
                `;
            } else if (status === 'Approved') {
                // Show everything for approved events
                registrationCard.style.display = 'block';
                registrationsSection.style.display = 'block';
                rightCardTitle.textContent = 'Registration Management';
                registrationsHeading.textContent = `Registered Students (${event.registrations})`;
                eventActionsSection.innerHTML = `
                    <button class="action-button primary" onclick="editEvent()">Edit Event</button>
                    <button class="action-button secondary" onclick="duplicateEvent()">Duplicate Event</button>
                    <button class="action-button secondary" onclick="cancelEvent()">Cancel Event</button>
                `;
            } else if (status === 'Completed') {
                // Show attendee list for past events
                registrationCard.style.display = 'block';
                registrationsSection.style.display = 'block';
                rightCardTitle.textContent = 'Event Report';
                registrationsHeading.textContent = `Attendee List (${event.registrations})`;
                // Update right card actions
                const actionsSection = registrationCard.querySelector('.registration-actions-section');
                actionsSection.innerHTML = `
                    <button class="action-button primary" onclick="viewRegistrations()">View Attendee List</button>
                    <button class="action-button secondary" onclick="exportStudentList()">Export Attendee List</button>
                `;
                // Update left card actions for past events
                eventActionsSection.innerHTML = `
                    <button class="action-button primary" onclick="duplicateEvent()">Duplicate Event</button>
                    <button class="action-button secondary" onclick="viewEventSummary()">View Event Summary</button>
                `;
            }
        }

        function viewRegistrations() {
            const section = document.getElementById('registrations-section');
            const event = eventsData[eventId];
            const heading = document.getElementById('registrations-heading');
            heading.textContent = `Registered Students (${event.registrations})`;

            section.classList.toggle('hidden');
            if (!section.classList.contains('hidden')) {
                const students = event.students || [];
                const list = document.getElementById('registrations-list');
                if (students.length === 0) {
                    list.innerHTML = '<p>No students registered yet.</p>';
                } else {
                    list.innerHTML = `
                        <table style="width: 100%; border-collapse: collapse;">
                            <thead>
                                <tr style="background-color: #f8fafc;">
                                    <th style="padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-weight: 600;">Name</th>
                                    <th style="padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-weight: 600;">Email</th>
                                    <th style="padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-weight: 600;">Department</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${students.map(student => `
                                    <tr style="border-bottom: 1px solid #f1f5f9;">
                                        <td style="padding: 12px;">${student.name}</td>
                                        <td style="padding: 12px;">${student.email}</td>
                                        <td style="padding: 12px;">${student.department}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                }
            }
        }

        function exportStudentList() {
            const event = eventsData[eventId];
            const students = event.students || [];
            if (students.length === 0) {
                alert('No students registered for this event.');
                return;
            }

            // Create CSV content
            const csvContent = [
                ['Name', 'Email', 'Department'],
                ...students.map(student => [student.name, student.email, student.department])
            ].map(row => row.join(',')).join('\n');

            // Create and download file
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `${event.name.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_registrations.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function sendNotification() {
            // Simple modal for notification
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
                z-index: 1000;
            `;
            modal.innerHTML = `
                <div style="background: white; padding: 2rem; border-radius: 1rem; max-width: 500px; width: 90%;">
                    <h3 style="margin-bottom: 1rem;">Send Notification to Registered Students</h3>
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Subject:</label>
                        <input type="text" id="notification-subject" style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem;" placeholder="Enter notification subject">
                    </div>
                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Message:</label>
                        <textarea id="notification-message" style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; min-height: 100px;" placeholder="Enter your message"></textarea>
                    </div>
                    <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                        <button onclick="closeModal(this)" style="padding: 0.75rem 1.5rem; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 0.5rem; cursor: pointer;">Cancel</button>
                        <button onclick="sendNotificationAction()" style="padding: 0.75rem 1.5rem; background: #7c3aed; color: white; border: none; border-radius: 0.5rem; cursor: pointer;">Send</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function sendNotificationAction() {
            const subject = document.getElementById('notification-subject').value;
            const message = document.getElementById('notification-message').value;
            if (!subject.trim() || !message.trim()) {
                alert('Please fill in both subject and message.');
                return;
            }
            // In a real app, this would send the notification
            alert(`Notification sent to registered students!\n\nSubject: ${subject}\nMessage: ${message}`);
            closeModal();
        }

        function closeModal(button) {
            const modal = button ? button.closest('.modal-overlay') : document.querySelector('.modal-overlay');
            if (modal) {
                modal.remove();
            }
        }

            alert('Duplicate Event functionality would create a new event request based on this one.');
